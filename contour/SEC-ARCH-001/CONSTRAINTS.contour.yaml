# CONSTRAINTS.contour.yaml — рульсет гейта задачи SEC-ARCH-001.
# Базовые правила сгенерированы из mechanical_checks RUBRICS.md
# (как в platformv-arch-bench) — общий знаменатель для всех рук.
# Правила контура — через contour/gate_extra.py (трассировка,
# вымышленные компоненты, разрешимость адресов трассы).
# Проверка: arch-be control check . --constraints CONSTRAINTS.contour.yaml
# CONSTRAINTS.yaml — fitness-правила для SEC-ARCH-001.
# Источник: mechanical_checks из RUBRICS.md (rubrics).
# Проверка: arch-be control check . --constraints CONSTRAINTS.yaml
constraints:
  - id: SP-SEC-ARCH-001-01
    name: deliverable-d1
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*резюме"
    severity: high

  - id: SP-SEC-ARCH-001-02
    name: deliverable-d2
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(схема|контур)"
    severity: high

  - id: SP-SEC-ARCH-001-03
    name: deliverable-d3
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(аутентификац|авторизац|уч[её]тн)"
    severity: high

  - id: SP-SEC-ARCH-001-04
    name: deliverable-d4
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(секрет|сертификат)"
    severity: high

  - id: SP-SEC-ARCH-001-05
    name: deliverable-d5
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(аудит|мониторинг)"
    severity: high

  - id: SP-SEC-ARCH-001-06
    name: deliverable-d6
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(сегментац|защит[аы]\\s+API)"
    severity: high

  - id: SP-SEC-ARCH-001-07
    name: deliverable-d7
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(матриц|ответственност)"
    severity: high

  - id: SP-SEC-ARCH-001-08
    name: deliverable-d8
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(регуляторн|719|683|851)"
    severity: high

  - id: SP-SEC-ARCH-001-09
    name: deliverable-d9
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*трассиров"
    severity: high

  - id: SP-SEC-ARCH-001-10
    name: deliverable-d10
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}.*(риск|допущен|альтернатив)"
    severity: high

  - id: SP-SEC-ARCH-001-99
    name: max-words
    type: command_succeeds
    command: "bash -c \"test $(wc -w < answer.md 2>/dev/null || echo 999999) -le 4000\""
    severity: medium
  - id: CT-SEC-ARCH-001-trace
    name: contour-trace
    type: command_succeeds
    command: "python3 .contour/gate_extra.py --check trace --repo . --meta .contour/task_meta.json"
    severity: high

  - id: CT-SEC-ARCH-001-resolvable
    name: contour-resolvable
    type: command_succeeds
    command: "python3 .contour/gate_extra.py --check resolvable --repo . --meta .contour/task_meta.json"
    severity: high
