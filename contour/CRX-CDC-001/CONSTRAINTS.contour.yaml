# CONSTRAINTS.contour.yaml — рульсет гейта задачи CRX-CDC-001.
# Базовые правила сгенерированы из mechanical_checks RUBRICS.md
# (как в platformv-arch-bench) — общий знаменатель для всех рук.
# Правила контура — через contour/gate_extra.py (трассировка,
# вымышленные компоненты, разрешимость адресов трассы).
# Проверка: arch-be control check . --constraints CONSTRAINTS.contour.yaml
# CONSTRAINTS.yaml — fitness-правила для CRX-CDC-001.
# Источник: mechanical_checks из RUBRICS.md (rubrics).
# Проверка: arch-be control check . --constraints CONSTRAINTS.yaml
constraints:
  - id: SP-CRX-CDC-001-01
    name: deliverable-d1
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*резюме"
    severity: high

  - id: SP-CRX-CDC-001-02
    name: deliverable-d2
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*схема"
    severity: high

  - id: SP-CRX-CDC-001-03
    name: deliverable-d3
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(cdc|захват)"
    severity: high

  - id: SP-CRX-CDC-001-04
    name: deliverable-d4
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(доставк|поряд|ordering|гарант)"
    severity: high

  - id: SP-CRX-CDC-001-05
    name: deliverable-d5
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(контракт|схем\\w*\\s+сообщен|schema)"
    severity: high

  - id: SP-CRX-CDC-001-06
    name: deliverable-d6
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(деградац|отказоустойчив|сбо)"
    severity: high

  - id: SP-CRX-CDC-001-07
    name: deliverable-d7
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*безопасност"
    severity: high

  - id: SP-CRX-CDC-001-08
    name: deliverable-d8
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(производительност|ёмкост)"
    severity: high

  - id: SP-CRX-CDC-001-09
    name: deliverable-d9
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*трассировк"
    severity: high

  - id: SP-CRX-CDC-001-10
    name: deliverable-d10
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(допущен|риск|альтернатив)"
    severity: high

  - id: SP-CRX-CDC-001-99
    name: max-words
    type: command_succeeds
    command: "bash -c \"test $(wc -w < answer.md 2>/dev/null || echo 999999) -le 4000\""
    severity: medium
  - id: CT-CRX-CDC-001-trace
    name: contour-trace
    type: command_succeeds
    command: "python3 .contour/gate_extra.py --check trace --repo . --meta .contour/task_meta.json"
    severity: high

  - id: CT-CRX-CDC-001-resolvable
    name: contour-resolvable
    type: command_succeeds
    command: "python3 .contour/gate_extra.py --check resolvable --repo . --meta .contour/task_meta.json"
    severity: high
