# handoff_quiz.yaml — викторина преемника PGL-OLAP-001
# Вопросы про состояние работы; сверяет независимый проверяющий.
# Механические метрики (keyterm_recall, handoff_coverage) считает
# runners/contour_score.py — они не требуют судьи.
task: PGL-OLAP-001
verifier:
  - id: Q1
    q: "Что уже сделано предыдущим исполнителем и какие решения приняты (по пунктам, со ссылкой на разделы документа)?"
  - id: Q2
    q: "Что осталось незакрытым: какие разделы неполны, какие вопросы открыты?"
  - id: Q3
    q: "Какие допущения приняты и какие факты требуют проверки у вендора?"
  - id: Q4
    q: "Что делать, если принятое решение окажется неверным: какой план отката и какие границы «не трогать»?"
mechanical:
  keyterm_recall: "доля ключевых терминов решения из v1 (топ компонентов), названных в RESUME.md"
  handoff_coverage: "сколько из пяти семейств содержания (что сделано / что осталось / решения / риски-допущения / откат) есть в артефакте передачи"
