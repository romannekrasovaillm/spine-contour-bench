# CONSTRAINTS.contour.yaml — рульсет гейта задачи PGL-ARCH-002.
# Базовые правила сгенерированы из mechanical_checks RUBRICS.md
# (как в platformv-arch-bench) — общий знаменатель для всех рук.
# Правила контура — через contour/gate_extra.py (трассировка,
# вымышленные компоненты, разрешимость адресов трассы).
# Проверка: arch-be control check . --constraints CONSTRAINTS.contour.yaml
# CONSTRAINTS.yaml — fitness-правила для PGL-ARCH-002.
# Источник: mechanical_checks из RUBRICS.md (rubrics).
# Проверка: arch-be control check . --constraints CONSTRAINTS.yaml
constraints:
  - id: SP-PGL-ARCH-002-01
    name: deliverable-d1
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*резюме"
    severity: high

  - id: SP-PGL-ARCH-002-02
    name: deliverable-d2
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*схема\\s+разв"
    severity: high

  - id: SP-PGL-ARCH-002-03
    name: deliverable-d3
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(топологи|кворум)"
    severity: high

  - id: SP-PGL-ARCH-002-04
    name: deliverable-d4
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*режим\\w*\\s+репликац"
    severity: high

  - id: SP-PGL-ARCH-002-05
    name: deliverable-d5
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(подключени|pooler|пул\\w*\\s+соединени)"
    severity: high

  - id: SP-PGL-ARCH-002-06
    name: deliverable-d6
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*безопасност"
    severity: high

  - id: SP-PGL-ARCH-002-07
    name: deliverable-d7
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*резервн"
    severity: high

  - id: SP-PGL-ARCH-002-08
    name: deliverable-d8
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(производительност|ёмкост)"
    severity: high

  - id: SP-PGL-ARCH-002-09
    name: deliverable-d9
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*трассировк"
    severity: high

  - id: SP-PGL-ARCH-002-10
    name: deliverable-d10
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(допущен|альтернатив)"
    severity: high

  - id: SP-PGL-ARCH-002-99
    name: max-words
    type: command_succeeds
    command: "bash -c \"test $(wc -w < answer.md 2>/dev/null || echo 999999) -le 4000\""
    severity: medium
  - id: CT-PGL-ARCH-002-trace
    name: contour-trace
    type: command_succeeds
    command: "python3 .contour/gate_extra.py --check trace --repo . --meta .contour/task_meta.json"
    severity: high

  - id: CT-PGL-ARCH-002-resolvable
    name: contour-resolvable
    type: command_succeeds
    command: "python3 .contour/gate_extra.py --check resolvable --repo . --meta .contour/task_meta.json"
    severity: high
